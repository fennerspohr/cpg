appId: com.cpg.app
productName: CPG
copyright: Copyright © 2025

npmRebuild: false

directories:
  output: dist-electron

# What gets included in the package
files:
  - electron/**/*
  - .output/**/*
  - .env
  - node_modules/**/*
  - package.json

# The .output folder from nuxt build must be included
extraResources:
  - from: .output
    to: app/.output
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/favicon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerLanguages:
    - pt_BR
  language: 1046
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: public/favicon.ico
  category: Office

# Nuxt server runs as a Node child process, not a packaged binary
# so we need Node available — electron ships its own Node, we use that
